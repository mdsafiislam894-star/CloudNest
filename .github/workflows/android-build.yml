name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip repository archive if available
        run: |
          unzip -o CloudNest-source.zip || unzip -o *.zip || true
          if [ -d "CloudNest" ]; then
            cp -rf CloudNest/* .
            cp -rf CloudNest/.[!.]* . || true
          fi
          chmod +x gradlew

      - name: Patch Kotlin source code errors
        run: |
          python3 -c "
          import os, re
          print('=== PATCH START ===')
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.kt'):
                      p = os.path.join(root, file)
                      try:
                          with open(p, 'r', encoding='utf-8') as f:
                              c = f.read()
                          if 'CloudNestMark' in c:
                              print(f'Removing CloudNestMark from {p}')
                              c = re.sub(r'.*CloudNestMark.*\n?', '', c)
                              with open(p, 'w', encoding='utf-8') as f:
                                  f.write(c)
                      except Exception as e: pass
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if 'CloudNestMark' in file:
                      p = os.path.join(root, file)
                      try: os.remove(p)
                      except: pass
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file == 'AppNavHost.kt':
                      p = os.path.join(root, file)
                      try:
                          with open(p, 'r', encoding='utf-8') as f: c = f.read()
                          c = re.sub(r'onOpenCloud\s*=\s*\{[^}]*\}', 'onOpenCloud = { navController.navigateOnce(Route.CloudAccount) }', c)
                          with open(p, 'w', encoding='utf-8') as f: f.write(c)
                      except Exception as e: pass
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file == 'FilesScreen.kt':
                      p = os.path.join(root, file)
                      print(f'Found FilesScreen.kt at {p}')
                      lines = open(p, 'r', encoding='utf-8').readlines()
                      print(f'Total lines: {len(lines)}')
                      start = max(0, 595)
                      end = min(len(lines), 645)
                      print(f'--- {p} lines {start+1} to {end} ---')
                      for i in range(start, end):
                          print(f'{i+1}: {lines[i]}', end='')
          "

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: ./gradlew :android:assembleDebug -PsplitAbis=false --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudNest-APK
          path: android/build/outputs/apk/debug/*.apk
