name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract zip archive
      run: |
        unzip -o CloudNest-source.zip
        echo "Extracted files:"
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inspect and Fix project code
      run: |
        python3 -c "
        import os, glob

        print('=== ALL FILES ===')
        for root, dirs, files in os.walk('.'):
            for f in files:
                p = os.path.join(root, f)
                if not p.startswith('./.git'):
                    print(p)

        print('\n=== AuthScreen.kt ===')
        for p in glob.glob('**/AuthScreen.kt', recursive=True):
            with open(p) as f:
                print(f.read())

        print('\n=== AppNavHost.kt ===')
        for p in glob.glob('**/AppNavHost.kt', recursive=True):
            with open(p) as f:
                print(f.read())
        "

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Android App
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: '**/build/outputs/apk/debug/*.apk'

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip archive
        run: |
          unzip -o CloudNest-source.zip
          echo "Extracted files:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Patch project code
        run: |
          echo "Patching unresolved references..."
          AUTH_FILE=$(find . -name "AuthScreen.kt" | head -n 1)
          if [ -n "$AUTH_FILE" ]; then
            sed -i 's/CloudNestMark/Spacer/g' "$AUTH_FILE"
          fi
          NAV_FILE=$(find . -name "AppNavHost.kt" | head -n 1)
          if [ -n "$NAV_FILE" ]; then
            sed -i '/onOpenCloud/d' "$NAV_FILE"
          fi

      - name: Build Android App
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "No build file found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudNest-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
