name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip repository archive if available
        run: |
          unzip -o CloudNest-source.zip || unzip -o *.zip || true
          if [ -d "CloudNest" ]; then
            cp -rf CloudNest/* .
            cp -rf CloudNest/.[!.]* . || true
            rm -rf CloudNest
          fi
          chmod +x gradlew

      - name: Code fix
        run: |
          rm -f ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/components/CloudNestMark.kt
          sed -i '/CloudNestMark/d' ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/auth/AuthScreen.kt
          sed -i '/onOpenCloud/d' ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/navigation/AppNavHost.kt
          sed -i 's/onLoggedOut = {/onOpenCloud = { navController.navigateOnce(Route.CloudAccount) }, onLoggedOut = {/' ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/navigation/AppNavHost.kt
          sed -n '610,635p' ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/files/FilesScreen.kt || true
          sed -i 's/containerColor = .*/ /             python3 -c 'import re; p="ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/files/FilesScreen.kt"; s=open(p).read(); s=re.sub(r"ToggleFloatingActionButton\s*\([^{]*\{", "ToggleFloatingActionButton(checked = showAddMenu, onCheckedChange = { showAddMenu = it }) {", s, flags=re.DOTALL); open(p,"w").write(s)'
          python3 -c 'import re; p="ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/files/FilesScreen.kt"; s=open(p).read(); s=re.sub(r"ToggleFloatingActionButton\s*\([^{]*\{", "ToggleFloatingActionButton(checked = showAddMenu, onCheckedChange = { showAddMenu = it }) {", s, flags=re.DOTALL); open(p,"w").write(s)'       python3 -c "import re; p='ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/files/FilesScreen.kt'; s=open(p).read(); s=re.sub(r'ToggleFloatingActionButton\s*\([^\{]*\{', 'ToggleFloatingActionButton(checked = showAddMenu, onCheckedChange = { showAddMenu = it }) {', s, flags=re.DOTALL); open(p,'w').write(s)"g' ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/files/FilesScreen.kt || true
          sed -i '/containerColor/d' ui/src/jvmCommonMain/kotlin/com/safiislam/nexvault/presentation/files/FilesScreen.kt || true

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        run: ./gradlew :android:assembleDebug -PsplitAbis=false --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudNest-APK
          path: android/build/outputs/apk/debug/*.apk
